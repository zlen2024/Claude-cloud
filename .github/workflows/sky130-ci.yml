name: sky130-ci
on:
  push:
    paths: ["sky130-web/**", ".github/workflows/sky130-*.yml"]
  pull_request:
    paths: ["sky130-web/**"]
defaults:
  run:
    working-directory: sky130-web
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sky130-web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:pwa
      - run: npm run build
