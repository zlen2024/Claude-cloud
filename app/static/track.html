<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semak Tempahan — OrderFlow</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<section class="hero">
  <div class="pill acc" id="badge">OrderFlow</div>
  <h1>Jejak <span class="grad">tempahan</span> anda</h1>
  <p class="mute" id="sub">Masukkan Order ID untuk lihat status dan progress terkini.</p>
  <form class="search" id="f"><input id="code" placeholder="ORD-2026-0001" autocomplete="off" required><button>Semak</button></form>
  <div class="mute" style="font-size:13px">Staff? <a href="/app">Masuk dashboard →</a></div>
</section>
<section class="result"><div class="card" id="res" style="display:none"></div></section>
<script src="/static/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s);
gsap.from(".hero > *",{y:30,opacity:0,stagger:.12,duration:.8,ease:"power3.out"});
gsap.to("body",{backgroundPosition:"20% 10%",duration:12,repeat:-1,yoyo:true,ease:"sine.inOut"});
const fmt=d=>new Date(d).toLocaleString("ms-MY",{dateStyle:"medium",timeStyle:"short"});
async function track(code){
  const res=$("#res"),r=await fetch("/api/track/"+encodeURIComponent(code));
  res.style.display="block";
  if(!r.ok){res.innerHTML=`<b>Order tidak dijumpai.</b><p class="mute">Semak semula Order ID anda.</p>`;gsap.from(res,{x:-12,duration:.5,ease:"elastic.out(1,.3)"});return}
  const d=await r.json(),idx=d.steps.findIndex(s=>s.key===d.status),at={};
  d.timeline.forEach(t=>at[t.status]=t.at);
  res.innerHTML=`<div class="row"><div><div class="mute">Order ${d.code}</div><h2 style="margin:2px 0">${d.title}</h2>
    <div class="mute">Hi ${d.customer}${d.due_date?` · Anggaran siap ${d.due_date}`:""}</div></div>
    <span class="pill ${d.status==="completed"?"ok":"acc"}" style="flex:none">${d.status_label}</span></div>
    <div class="bar"><i id="pb"></i></div>
    <ul class="steps">${d.steps.map((s,i)=>`<li class="${i<idx||d.status==="completed"?"done":i===idx?"now":"todo"}"><span class="dot">${i<idx||d.status==="completed"?"✓":i+1}</span>
      <div><b>${s.label}</b>${at[s.key]?`<div class="mute" style="font-size:12px">${fmt(at[s.key])}</div>`:""}</div></li>`).join("")}</ul>`;
  gsap.fromTo(res,{y:30,opacity:0},{y:0,opacity:1,duration:.6,ease:"power3.out"});
  gsap.to("#pb",{width:(idx/(d.steps.length-1)*100)+"%",duration:1.2,ease:"power2.out",delay:.2});
  gsap.from(".steps li",{x:-20,opacity:0,stagger:.08,duration:.5,delay:.3});
  gsap.fromTo(".steps li.now .dot",{scale:1},{scale:1.2,repeat:-1,yoyo:true,duration:.9,ease:"sine.inOut"});
}
$("#f").onsubmit=e=>{e.preventDefault();track($("#code").value.trim());history.replaceState(0,"","?id="+$("#code").value.trim())};
const q=new URLSearchParams(location.search).get("id");if(q){$("#code").value=q;track(q)}
</script></body></html>
