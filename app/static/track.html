<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8a64">
<title>Semak Tempahan — OrderFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head>
<body data-product="command">
<div class="orbs"><i></i><i></i><i></i></div>
<div class="track">
  <div class="brandrow"><div class="logo">O</div><b>OrderFlow</b><a href="/app" class="small" style="margin-left:auto">Staff login →</a></div>
  <section id="intro">
    <h1>Jejak <span class="grad">tempahan</span> anda.</h1>
    <p class="mute">Masukkan Order ID untuk lihat status dan progress terkini.</p>
    <form class="search" id="f"><input id="code" placeholder="ORD-2026-0001" autocomplete="off" autocapitalize="characters" enterkeyhint="search" required><button>Semak status</button></form>
  </section>
  <div class="card" id="res" style="display:none;margin-top:18px"></div>
</div>
<script src="/static/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => new Date(d).toLocaleString("ms-MY", { dateStyle: "medium", timeStyle: "short" });
gsap.from(".brandrow, #intro > *", { y: 24, opacity: 0, stagger: .1, duration: .7, ease: "power3.out" });
document.querySelectorAll(".orbs i").forEach((o, i) => gsap.to(o, { x: i % 2 ? -50 : 50, y: 30, scale: 1.1, duration: 9 + i * 3, repeat: -1, yoyo: true, ease: "sine.inOut" }));

async function track(code) {
  const res = $("#res"), r = await fetch("/api/track/" + encodeURIComponent(code));
  res.style.display = "block";
  if (!r.ok) {
    res.innerHTML = `<b>Order tidak dijumpai.</b><p class="mute" style="margin:4px 0 0">Semak semula Order ID anda.</p>`;
    gsap.fromTo(res, { x: -10 }, { x: 0, duration: .5, ease: "elastic.out(1,.3)" }); return;
  }
  const d = await r.json(), idx = d.steps.findIndex(s => s.key === d.status), done = d.status === "completed", at = {};
  d.timeline.forEach(t => at[t.status] = t.at);
  res.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="mute small">${esc(d.code)}</span>
      <span class="pill ${done ? "ok" : "acc"}">${esc(d.status_label)}</span></div>
    <h2 style="margin:4px 0 2px">${esc(d.title)}</h2>
    <div class="mute small">Hi ${esc(d.customer)}${d.due_date ? ` · Anggaran siap ${d.due_date}` : ""}</div>
    <div class="bar" style="margin-top:14px"><i id="pb"></i></div>
    <ul class="steps">${d.steps.map((s, i) => { const cls = i < idx || done ? "done" : i === idx ? "now" : "todo";
      return `<li class="${cls}"><span class="dot">${cls === "done" ? "✓" : i + 1}</span><div><b>${s.label}</b>${at[s.key] ? `<div class="mute small">${fmt(at[s.key])}</div>` : ""}</div></li>` }).join("")}</ul>`;
  gsap.fromTo(res, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: "power3.out" });
  gsap.to("#pb", { width: (idx / (d.steps.length - 1) * 100) + "%", duration: 1.1, ease: "power2.out", delay: .2 });
  gsap.from(".steps li", { x: -16, opacity: 0, stagger: .07, duration: .45, delay: .25 });
  gsap.fromTo(".steps li.now .dot", { scale: 1 }, { scale: 1.15, repeat: -1, yoyo: true, duration: .9, ease: "sine.inOut" });
}
$("#f").onsubmit = e => { e.preventDefault(); const c = $("#code").value.trim(); track(c); history.replaceState(0, "", "?id=" + encodeURIComponent(c)) };
const q = new URLSearchParams(location.search).get("id"); if (q) { $("#code").value = q; track(q) }
</script></body></html>
