<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Urus langganan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head>
<body data-product="crm">
<div class="orbs"><i></i><i></i><i></i></div>
<div class="track">
  <div class="brandrow" style="margin-bottom:6vh"><div class="logo">O</div><b>OrderFlow</b></div>
  <div class="card" id="box"><p class="mute">Memuatkan…</p></div>
  <p class="small mute" style="margin-top:14px">Mesej status tempahan dan promosi hanya dihantar ke channel yang anda setuju. Anda boleh tukar bila-bila masa.</p>
</div>
<script src="/static/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = location.pathname.split("/").pop();
const LABEL = { whatsapp: "WhatsApp", email: "Email", sms: "SMS" };
async function load() {
  const r = await fetch("/api/consent/" + encodeURIComponent(token));
  if (!r.ok) { $("#box").innerHTML = "<b>Link tidak sah atau telah tamat.</b>"; return }
  const d = await r.json();
  $("#box").innerHTML = `<h2>Hi ${esc(d.name)} 👋</h2><p class="mute">Pilih cara anda mahu terima mesej daripada kami.</p>
    <div class="form" style="margin-top:12px">${Object.keys(LABEL).filter(k => d.has[k]).map(k => `
      <label class="task" style="display:flex;justify-content:space-between;align-items:center;margin:0;font-size:15px;color:var(--fg)">${LABEL[k]}
        <input type="checkbox" data-c="${k}" ${d.consent[k] ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--pc)"></label>`).join("")}
      <button class="block" id="sv">Simpan pilihan</button>
      <button class="ghost block" id="none">Berhenti terima semua mesej</button></div>`;
  gsap.from("#box", { y: 20, opacity: 0, duration: .5, ease: "power3.out" });
  const save = async consent => {
    const r = await fetch("/api/consent/" + encodeURIComponent(token), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ consent }) });
    $("#box").innerHTML = r.ok ? `<h2>Terima kasih ✓</h2><p class="mute">Pilihan anda telah disimpan.</p>` : `<b>Ralat. Sila cuba lagi.</b>`;
    gsap.from("#box", { scale: .96, opacity: 0, duration: .4, ease: "back.out(1.6)" });
  };
  $("#sv").onclick = () => save(Object.fromEntries([...document.querySelectorAll("[data-c]")].map(x => [x.dataset.c, x.checked])));
  $("#none").onclick = () => save({ whatsapp: false, email: false, sms: false });
}
load();
</script></body></html>
